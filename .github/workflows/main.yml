name: Preprocessing Pipeline

on:
  push:
    paths:
      - 'Preprocessing/automate_Ginanti_Riski.py'
      - 'dataset_raw/**'
      - '.github/workflows/main.yml'

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run preprocessing script
      run: |
        mkdir -p Preprocessing/car_preprocessing
        python Preprocessing/automate_Ginanti_Riski.py

    - name: Commit and push processed files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add Preprocessing/car_preprocessing/*.csv
        git commit -m "Add processed dataset from preprocessing pipeline" || echo "No changes to commit"
        git push origin HEAD:Main
